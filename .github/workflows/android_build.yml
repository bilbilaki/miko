name: Flutter Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: ⚙️ Build release APK for arm64
        run: flutter build apk --release --target-platform=android-arm64
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_VERSION: 27.0.12077973

      - name: 📂 Find and rename APK file
        id: find_apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "app-arm64-v8a-release.apk")
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            # Extract app version from pubspec.yaml and format the name
            APP_VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | sed 's/+//')
            NEW_NAME="app_v${APP_VERSION}_arm64.apk"
            mv "$APK_PATH" "build/app/outputs/flutter-apk/$NEW_NAME"
            echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "APK for arm64 not found."
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1 # Fail the step if the specific APK is not found
          fi

      - name: ⬆️ Upload artifact if build succeeded
        if: steps.find_apk.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: build/app/outputs/flutter-apk/${{ steps.find_apk.outputs.new_name }}

  release:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: app-arm64-release
          path: ./

      - name: 🚀 Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.apk
          body: |
            ### 📦 Release created automatically by GitHub Actions
            
            This release includes the compiled Android APK for the arm64 architecture.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}