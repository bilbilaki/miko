name: Android CI/CD - Build, Test & Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17 (Azul)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 25
          arch: arm64-v8a
          target: default

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: flutter build apk --debug 

      - name: Build release APK (arm64)
        run: flutter build apk --release

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: android-v${{ github.run_number }}
          name: Android Release v${{ github.run_number }}
          body: |
            Android APK builds
            - Debug: app-arm64-v8a-debug.apk
            - Release: app-arm64-v8a-release.apk
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}